name: Build DrawAnywhere Study APK
on:
  push:
    branches: [study-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android API
        run: sdkmanager "platforms;android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply experimental source patch
        run: |
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          p=Path("study-patch/patch.py.zlib.b64")
          out=Path("/tmp/drawanywhere_study_patch.py")
          out.write_bytes(zlib.decompress(base64.b64decode(p.read_text().strip())))
          PY
          python3 /tmp/drawanywhere_study_patch.py .
          git diff --check
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DrawAnywhere-Study-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
