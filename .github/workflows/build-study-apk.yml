name: Build DrawAnywhere Study APK
on:
  push:
    branches: [study-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android API
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
      - name: Apply experimental source patch
        run: |
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          p=Path("study-patch/patch.py.zlib.b64")
          out=Path("/tmp/drawanywhere_study_patch.py")
          raw=zlib.decompress(base64.b64decode(p.read_text().strip() + "===")).decode()
          raw=raw.replace("tool.onStart(newPoint)" + chr(10) + "    }" + chr(10) + "    fun updateLatestStroke", "tool.onStart(newPoint)" + chr(10) + "    }" + chr(10) + chr(10) + "    fun updateLatestStroke")
          raw=raw.replace("removeExpiredStrokes(System.currentTimeMillis())" + chr(10) + "        canvas.save()", "removeExpiredStrokes(System.currentTimeMillis())" + chr(10) + chr(10) + "        canvas.save()")
          out.write_text(raw)
          PY
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          python3 /tmp/drawanywhere_study_patch.py .
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/shezik/drawanywhere/MainService.kt")
          t=p.read_text()
          t=t.replace("import kotlinx.coroutines.launch", "import kotlinx.coroutines.launch" + chr(10) + "import kotlinx.coroutines.withContext")
          anchor="    override fun onBind(intent: Intent?): IBinder? = null"
          funcs="    private var externalUiWasPassthrough = false\n    private var externalUiCanvasWasVisible = true\n\n    private fun prepareExternalUi() {\n        externalUiWasPassthrough = viewModel.uiState.value.canvasPassthrough\n        externalUiCanvasWasVisible = viewModel.uiState.value.canvasVisible\n        viewModel.setCanvasPassthrough(true)\n        viewModel.setCanvasVisibility(false)\n    }\n\n    private fun restoreAfterExternalUi() {\n        viewModel.setCanvasVisibility(externalUiCanvasWasVisible)\n        viewModel.setCanvasPassthrough(externalUiWasPassthrough)\n    }\n\n"
          assert anchor in t
          t=t.replace(anchor,funcs+anchor)
          p.write_text(t)
          v=Path("gradle/libs.versions.toml")
          v.write_text(v.read_text().replace('coreKtx = "1.19.0"','coreKtx = "1.17.0"'))
          PY
          git diff --check
      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DrawAnywhere-Study-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
